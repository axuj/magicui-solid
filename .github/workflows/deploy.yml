name: Deploy to GitHub Pages

on:
  push:
    branches: [master, v2, ci]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          path: main

      - name: Checkout v2
        uses: actions/checkout@v7
        with:
          ref: v2
          path: v2

      - uses: nubjs/setup-nub@v0

      - name: Build master
        working-directory: main
        run: |
          nub ci
          nub run build
        env:
          SITE_URL: https://axuj.github.io
          BASE_PATH: /magicui-solid

      - name: Build v2
        working-directory: v2
        run: |
          nub ci
          nub run build
        env:
          SITE_URL: https://axuj.github.io
          BASE_PATH: /magicui-solid/v2

      - name: Merge both builds into one artifact
        run: |
          mkdir -p main/dist/v2
          cp -R v2/dist/. main/dist/v2/

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: main/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
